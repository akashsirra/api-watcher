<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>API Status</title><style>body{font-family:system-ui;max-width:760px;margin:60px auto;padding:0 20px}.card{border:1px solid #ddd;border-radius:16px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #eee;border-radius:12px;padding:18px}.value{font-size:28px;font-weight:700}</style></head><body><main class="card"><h1 id="name">Loading…</h1><p id="state">Checking…</p><div class="grid"><div class="stat">24h uptime<div class="value" id="uptime">—</div></div><div class="stat">24h avg latency<div class="value" id="latency">—</div></div></div><p>Last checked: <span id="checked">—</span></p><p><small>Verified by API Watcher.</small></p></main><script>const slug=new URLSearchParams(location.search).get("slug");fetch("https://gbukskuavtjnthblomsz.supabase.co/functions/v1/public-status?slug="+encodeURIComponent(slug)).then(r=>r.json()).then(x=>{name.textContent=x.monitor?.name||"API Status";state.textContent=x.monitor?.last_status==="up"?"● Operational":x.monitor?.last_status==="down"?"● Incident":"Awaiting first check";uptime.textContent=x.stats?.uptime==null?"No data":x.stats.uptime+"%";latency.textContent=x.stats?.avg_latency==null?"No data":Math.round(x.stats.avg_latency)+" ms";checked.textContent=x.monitor?.last_checked_at||"never"}).catch(e=>state.textContent="Unable to load status")</script></body></html>
