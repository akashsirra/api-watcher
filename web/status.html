<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>API Status</title><style>body{font-family:system-ui;max-width:760px;margin:60px auto;padding:0 20px}.card{border:1px solid #ddd;border-radius:16px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #eee;border-radius:12px;padding:18px}.value{font-size:28px;font-weight:700}img{vertical-align:middle}</style></head><body><main class="card"><h1 id="name">Loading…</h1><p id="state">Checking…</p><div class="grid"><div class="stat">24h uptime<div class="value" id="uptime">—</div></div><div class="stat">24h avg latency<div class="value" id="latency">—</div></div></div><p>Last checked: <span id="checked">—</span></p><p><img id="badge" alt="Verified uptime badge"></p><p><small>Verified by API Watcher.</small></p></main><script>const slug=new URLSearchParams(location.search).get("slug");const base="https://gbukskuavtjnthblomsz.supabase.co/functions/v1/";document.getElementById("badge").src=base+"badge?slug="+encodeURIComponent(slug)+"&metric=uptime";fetch(base+"public-status?slug="+encodeURIComponent(slug)).then(r=>r.json()).then(x=>{document.getElementById("name").textContent=x.monitor?.name||"API Status";document.getElementById("state").textContent=x.monitor?.last_status==="up"?"● Operational":x.monitor?.last_status==="down"?"● Incident":"Awaiting first check";document.getElementById("uptime").textContent=x.stats?.uptime==null?"No data":x.stats.uptime+"%";document.getElementById("latency").textContent=x.stats?.avg_latency==null?"No data":Math.round(x.stats.avg_latency)+" ms";document.getElementById("checked").textContent=x.monitor?.last_checked_at||"never"}).catch(()=>document.getElementById("state").textContent="Unable to load status")</script></body></html>
