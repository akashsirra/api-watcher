<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>API Watcher</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer}input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 12px}.card{border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}.muted{color:#666}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><h1>API Watcher</h1><p class="muted">Verified uptime and latency monitoring for developers.</p><section id="auth" class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="you@example.com"><button id="loginBtn" type="button" onclick="login()">Send magic link</button><p id="authMsg">Ready.</p></section><section id="app" hidden><div class="card"><h2>Add API monitor</h2><div class="row"><div><label>Name</label><input id="name" placeholder="My API"></div><div><label>Slug</label><input id="slug" placeholder="my-api"></div></div><label>Health URL</label><input id="url" placeholder="https://api.example.com/health"><button onclick="createMonitor()">Create monitor</button><p id="msg"></p></div><div class="card"><h2>Your monitors</h2><div id="list"></div></div></section><script>const URL="https://gbukskuavtjnthblomsz.supabase.co",KEY="sb_publishable_fgtlsXHpIVfctVOwLOo5iw_KBiMzqsr";const sb=supabase.createClient(URL,KEY);async function login(){const msg=document.getElementById("authMsg"),btn=document.getElementById("loginBtn"),email=document.getElementById("email").value.trim();if(!email){msg.textContent="Enter your email first.";return}if(!window.supabase){msg.textContent="Supabase library did not load. Check your internet connection and reload.";return}btn.disabled=true;msg.textContent="Sending magic link…";try{const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});msg.textContent=error?"Error: "+error.message:"✅ Magic link sent. Check your email inbox (and spam).";}catch(e){msg.textContent="Error: "+(e?.message||e)}finally{btn.disabled=false}}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session)return;auth.hidden=true;app.hidden=false;const {data,error}=await sb.from("monitors").select("id,slug,name,url,last_status,last_latency_ms,last_checked_at").eq("user_id",session.user.id).order("created_at",{ascending:false});list.innerHTML=error?error.message:(data||[]).map(m=>`<div class="card"><b>${m.name}</b><div>${m.last_status||"waiting"} · ${m.last_latency_ms??"—"}ms</div><small>${m.url}</small><br><a href="status.html?slug=${encodeURIComponent(m.slug)}">Public status</a> · <a href="${URL}/functions/v1/public-status?slug=${encodeURIComponent(m.slug)}">JSON</a></div>`).join("")||"<p>No monitors yet.</p>"}async function createMonitor(){const {data:{session}}=await sb.auth.getSession();const body={name:nameEl.value,slug:slugEl.value,url:urlEl.value};const r=await fetch(URL+"/functions/v1/monitor-api",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();msg.textContent=r.ok?"Created.":"Error: "+(j.error||"unknown");load()}const nameEl=document.getElementById("name"),slugEl=document.getElementById("slug"),urlEl=document.getElementById("url");sb.auth.onAuthStateChange(()=>load());load();</script></body></html>
