name: API Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check monitored APIs
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            "https://gbukskuavtjnthblomsz.supabase.co/functions/v1/api-watcher/check"
